 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videollamada Grupal - WebRTC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 20px;
    }
    #video-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    video {
      width: 30%;
      border: 2px solid #ccc;
      border-radius: 10px;
      margin: 10px;
    }
    #controls {
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>
<body>

  <h1>Videollamada Grupal en Tiempo Real</h1>

  <div id="video-grid">
    <video id="localVideo" autoplay muted></video>
  </div>

  <div id="controls">
    <button id="startCall">Unirse a la llamada</button>
    <button id="endCall">Terminar llamada</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();  // Conectar al servidor de señalización con Socket.io

    let localStream;
    let peerConnections = {};
    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' }
      ]
    };

    const localVideo = document.getElementById('localVideo');
    const videoGrid = document.getElementById('video-grid');
    const startCallButton = document.getElementById('startCall');
    const endCallButton = document.getElementById('endCall');

    startCallButton.addEventListener('click', startCall);
    endCallButton.addEventListener('click', endCall);

    async function startCall() {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;

      socket.emit('join-room', 'miSala');  // Unirse a una sala de videollamada
    }

    socket.on('user-connected', (userId) => {
      connectToNewUser(userId, localStream);
    });

    socket.on('user-disconnected', (userId) => {
      if (peerConnections[userId]) peerConnections[userId].close();
    });

    function connectToNewUser(userId, stream) {
      const peerConnection = new RTCPeerConnection(config);
      peerConnections[userId] = peerConnection;

      stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

      peerConnection.ontrack = (event) => {
        const video = document.createElement('video');
        video.srcObject = event.streams[0];
        video.autoplay = true;
        videoGrid.append(video);
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', userId, event.candidate);
        }
      };

      peerConnection.createOffer().then(offer => {
        return peerConnection.setLocalDescription(offer);
      }).then(() => {
        socket.emit('offer', userId, peerConnection.localDescription);
      });
    }

    socket.on('offer', (userId, description) => {
      const peerConnection = new RTCPeerConnection(config);
      peerConnections[userId] = peerConnection;

      peerConnection.setRemoteDescription(new RTCSessionDescription(description)).then(() => {
        return navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      }).then(stream => {
        stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));
        localVideo.srcObject = stream;
      }).then(() => {
        return peerConnection.createAnswer();
      }).then(answer => {
        return peerConnection.setLocalDescription(answer);
      }).then(() => {
        socket.emit('answer', userId, peerConnection.localDescription);
      });

      peerConnection.ontrack = (event) => {
        const video = document.createElement('video');
        video.srcObject = event.streams[0];
        video.autoplay = true;
        videoGrid.append(video);
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', userId, event.candidate);
        }
      };
    });

    socket.on('answer', (userId, description) => {
      peerConnections[userId].setRemoteDescription(new RTCSessionDescription(description));
    });

    socket.on('ice-candidate', (userId, candidate) => {
      peerConnections[userId].addIceCandidate(new RTCIceCandidate(candidate));
    });

    function endCall() {
      for (let userId in peerConnections) {
        peerConnections[userId].close();
        delete peerConnections[userId];
      }
      socket.emit('leave-room', 'miSala');
      window.location.reload();  // Recargar la página para reiniciar la llamada
    }
  </script>

</body>
</html>
