 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión de Audio en Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #status {
            font-size: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Transmisión de Audio en Vivo</h1>
    <p id="status">Esperando conexión...</p>
    <audio id="liveAudio" autoplay></audio>

    <script>
        const statusElement = document.getElementById('status');
        const liveAudio = document.getElementById('liveAudio');

        async function startLiveStream() {
            try {
                // Obtener acceso al micrófono
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Configurar el reproductor de audio
                liveAudio.srcObject = stream;
                statusElement.textContent = 'Conectado y transmitiendo...';

                // Aquí podrías enviar el stream a un servidor para distribución en vivo
                // Ejemplo: usar WebRTC o WebSockets para transmitir el audio

            } catch (err) {
                console.error('Error al acceder al micrófono: ', err);
                statusElement.textContent = 'No se pudo acceder al micrófono.';
            }
        }

        // Iniciar la transmisión cuando la página se cargue
        window.onload = startLiveStream;
    </script>
</body>
</html>
