<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Pantalla Completa</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <iframe src="https://poki.com/es/g/subway-surfers#fullscreen" id="game" allowfullscreen></iframe>

    <script>
        document.documentElement.requestFullscreen().catch(err => {
            console.log("No se pudo activar la pantalla completa: " + err);
        });
    </script>
</body>
</html>
