<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Carga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end; /* Mueve el contenido hacia abajo */
            justify-content: center;
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-bottom: 50px; /* Espacio extra desde el borde inferior */
        }
        .loading {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="loading">Cargando...</div>

<iframe src="https://aplicacionetv.wordpress.com/" width="30" height="5"></iframe>


    <script>
        function actualizarFondo() {
            if (window.matchMedia("(orientation: landscape)").matches) {
                document.body.style.backgroundImage = "url('https://media.themoviedb.org/t/p/w1000_and_h563_face/ywe9S1cOyIhR5yWzK7511NuQ2YX.jpg')";
            } else {
                document.body.style.backgroundImage = "url('https://pics.filmaffinity.com/captain_america_brave_new_world-589232463-mmed.jpg')";
            }
        }

        // Ejecutar al cargar la página
        actualizarFondo();

        // Detectar cambios de orientación
        window.addEventListener("resize", actualizarFondo);

        // Redirigir después de 5 segundos
        setTimeout(() => {
            window.location.href = "https://maicolyordan.github.io/Evoluci-nTV-/Inicio.html";
        }, 5000);
    </script>
</body>
</html>
