 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirección</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            position: relative;
        }
        .fullscreen-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script>
        // Mostrar la imagen por 5 segundos antes de redirigir
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "https://maicolyordan.github.io/Evoluci-nTV-/Inicio.html";
            }, 5000); // Redirige después de 5 segundos
        };
    </script>
</head>
<body>

    <!-- Imagen a pantalla completa -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDVH9h9L8gB7ycQ3Pbp-nYYGPMUdItGS8VRg&s" alt="Imagen completa" class="fullscreen-image">
</body>
</html>
