 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVOLUCION TV</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0d0b25;
            color: white;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            margin: 20px 0;
            text-align: center;
        }

        .header {
            text-align: center;
            padding: 10px;
            background-color: #0d0b25;
            font-size: 16px;
            color: #33aaff;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }

        .nav a {
            color: white;
            text-decoration: none;
        }

        .content {
            padding: 20px;
            position: relative;
        }

        .movie-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .movie-list {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .movie-list img {
            width: 100px;
            border-radius: 5px;
            cursor: pointer;
        }

.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: red;
    color: white;
    border: none;
    padding: 2px;
    border-radius: 50%;
    cursor: pointer;
}

.arrow-left {
    left: -1px;
    transform: translateY(110%); /* Baja el botón izquierdo */
}

.arrow-right {
    right: -2px;
    transform: translateY(-230%); /* Sube el botón derecho */
}

        /* Estilo para la imagen a pantalla completa */
        .fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .fullscreen-image img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        @media (orientation: landscape) {
            .search-box input {
                width: 250px;
            }

            .movie-list img {
                width: 200px;
            }
        }
    </style>
</head>
<body>
<h1>Euclides</h1>

<div class="movie-container">
    <button class="arrow arrow-left" onclick="scrollMovies(-200)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
            <g fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
            </g>
        </svg>
    </button>
</div>

    <div class="movie-list" id="movieList">
        <img src="https://pics.filmaffinity.com/Mentiroso_compulsivo-105787001-large.jpg" alt="imagen" onclick="openFullscreen(this)">
        <img src="https://pics.filmaffinity.com/Mentiroso_compulsivo-105787001-large.jpg" alt="imagen" onclick="openFullscreen(this)">
        <img src="https://pics.filmaffinity.com/Mentiroso_compulsivo-105787001-large.jpg" alt="imagen" onclick="openFullscreen(this)">
        <img src="https://pics.filmaffinity.com/Mentiroso_compulsivo-105787001-large.jpg" alt="imagen" onclick="openFullscreen(this)">
    </div>

<div class="movie-container">
    <button class="arrow arrow-right" onclick="scrollMovies(200)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
            <g fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6" />
            </g>
        </svg>
    </button>
</div>

<!-- Contenedor de la imagen en pantalla completa -->
<div class="fullscreen-image" id="fullscreenImage">
    <button class="close-btn" onclick="closeFullscreen()">×</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Image">
</div>

<script>
    function openFullscreen(image) {
        const fullscreenContainer = document.getElementById("fullscreenImage");
        const fullscreenImg = document.getElementById("fullscreenImg");

        // Establece la fuente de la imagen a pantalla completa
        fullscreenImg.src = image.src;

        // Muestra el contenedor de pantalla completa
        fullscreenContainer.style.display = "flex";
    }

    function closeFullscreen() {
        const fullscreenContainer = document.getElementById("fullscreenImage");
        fullscreenContainer.style.display = "none";
    }

    function scrollMovies(amount) {
        const movieList = document.getElementById("movieList");
        movieList.scrollBy({ left: amount, behavior: "smooth" });
    }
</script>
</body>
</html>
