 <!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor HTML con Vista Previa</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; }
        textarea { width: 90%; height: 500px; margin: 10px; padding: 10px; }
        .color-container { margin-top: 20px; }
        .color-box { display: inline-block; width: 50px; height: 50px; margin: 5px; border: 1px solid black; cursor: pointer; }
        .color-picker { display: none; }
    </style>
</head>
<body>
    <h2>Ingrese su código HTML</h2>
    <textarea id="htmlCode" placeholder="Escriba su código HTML aquí..."></textarea>
    <br>
    <button onclick="openPreview()">Vista Previa</button><h3>Colores detectados</h3>
<div class="color-container" id="colorContainer"></div>
<input type="color" id="colorPicker" class="color-picker" onchange="changeColor(this.value)">

<script>
    let selectedColor = "";

    function openPreview() {
        let code = document.getElementById("htmlCode").value;
        let previewWindow = window.open("", "Vista Previa", "width=800,height=600");
        previewWindow.document.open();
        previewWindow.document.write(code);
        previewWindow.document.close();
        detectColors(code);
    }

    function detectColors(code) {
        let colorContainer = document.getElementById("colorContainer");
        colorContainer.innerHTML = "";
        let colorRegex = /#([0-9A-Fa-f]{3,6})/g;
        let colors = [...new Set(code.match(colorRegex))];
        colors.forEach(color => {
            let colorBox = document.createElement("div");
            colorBox.className = "color-box";
            colorBox.style.backgroundColor = color;
            colorBox.onclick = function () {
                selectedColor = color;
                document.getElementById("colorPicker").click();
            };
            colorContainer.appendChild(colorBox);
        });
    }

    function changeColor(newColor) {
        if (selectedColor) {
            let htmlCode = document.getElementById("htmlCode").value;
            document.getElementById("htmlCode").value = htmlCode.replaceAll(selectedColor, newColor);
        }
    }
</script>

</body>
</html>
