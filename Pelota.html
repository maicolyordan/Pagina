 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Botón de Redirección</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            max-width: 90%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2em;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #ff4500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bienvenido</h1>
        <button onclick="redirigir()">Entrar</button>
    </div>
<iframe src="https://pelota14.wordpress.com/" width="30" height="10" style="border: 2px solid black;"></iframe>
    <script>
        function redirigir() {
            window.location.href = "https://pelotalibretv.com/agenda.html"; // Cambia esta URL a la que desees
        }
    </script>

</body>
</html>
