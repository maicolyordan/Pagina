 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Música</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #333;
      padding: 10px 20px;
      text-align: center;
    }
    header input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    .music-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px;
    }
    .music-item {
      padding: 10px;
      border-bottom: 1px solid #444;
      cursor: pointer;
      transition: background 0.3s;
    }
    .music-item:hover {
      background: #444;
    }
    .music-item.playing {
      background: #00eaff;
      color: #000;
    }
    .player {
      background: #222;
      padding: 20px;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .controls button {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .controls button:focus {
      outline: none;
    }
    .play-btn {
      background-color: #00eaff;
      color: #000;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 32px;
      border: none;
      cursor: pointer;
    }
    .play-btn:focus {
      outline: none;
    }
    .progress-container {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .progress-time {
      font-size: 14px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      margin: 0 10px;
      background: #444;
      border-radius: 2px;
      position: relative;
    }
    .progress {
      height: 100%;
      background: #00eaff;
      border-radius: 2px;
      width: 0;
    }
  </style>
</head>
<body>
  <header>
    <input type="text" id="search" placeholder="Buscar música...">
  </header>

  <div class="music-list-container" id="music-list">
    <!-- Aquí se mostrarán las canciones -->
  </div>

  <div class="player">
    <div class="progress-container">
      <span class="progress-time" id="current-time">00:00</span>
      <div class="progress-bar" id="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <span class="progress-time" id="duration">00:00</span>
    </div>
    <div class="controls">
      <button id="prev">&#9664;</button>
      <button class="play-btn" id="play">&#9654;</button>
      <button id="next">&#9654;&#9654;</button>
    </div>
    <audio id="audio"></audio>
  </div>

  <script>
    const musicList = [
      { title: "Canción 1", src: "https://gitlab.com/anderson1353803/andersonmp3/-/raw/0920a6c28edfacd80d8f3f790c66011e9f47340b/Plan_B_-_Es_Un_Secreto__Official_Video_.mp3?inline=false" },
      { title: "Canción 2", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { title: "Canción 3", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const progressBar = document.getElementById("progress-bar");
    const progress = document.getElementById("progress");
    const musicListEl = document.getElementById("music-list");
    const searchInput = document.getElementById("search");

    let currentSongIndex = 0;

    function loadMusic() {
      musicList.forEach((music, index) => {
        const item = document.createElement("div");
        item.className = "music-item";
        item.textContent = music.title;
        item.addEventListener("click", () => playMusic(index));
        musicListEl.appendChild(item);
      });
    }

    function playMusic(index) {
      const items = document.querySelectorAll(".music-item");
      items.forEach(item => item.classList.remove("playing"));

      const currentItem = musicListEl.children[index];
      currentItem.classList.add("playing");

      currentSongIndex = index;
      audio.src = musicList[index].src;
      audio.play();
      playBtn.textContent = "❚❚";
    }

    function playNextMusic() {
      currentSongIndex = (currentSongIndex + 1) % musicList.length;
      playMusic(currentSongIndex);
    }

    function playPreviousMusic() {
      currentSongIndex = (currentSongIndex - 1 + musicList.length) % musicList.length;
      playMusic(currentSongIndex);
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "❚❚";
      } else {
        audio.pause();
        playBtn.textContent = "▶";
      }
    });

    document.getElementById("next").addEventListener("click", playNextMusic);
    document.getElementById("prev").addEventListener("click", playPreviousMusic);

    audio.addEventListener("ended", playNextMusic);

    audio.addEventListener("timeupdate", () => {
      const currentTime = Math.floor(audio.currentTime);
      const duration = Math.floor(audio.duration);
      currentTimeEl.textContent = formatTime(currentTime);
      durationEl.textContent = formatTime(duration);
      const progressWidth = (audio.currentTime / audio.duration) * 100;
      progress.style.width = progressWidth + "%";
    });

    progressBar.addEventListener("click", (e) => {
      const width = progressBar.clientWidth;
      const offsetX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (offsetX / width) * duration;
    });

    searchInput.addEventListener("input", (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const items = document.querySelectorAll(".music-item");
      items.forEach((item) => {
        const isVisible = item.textContent.toLowerCase().includes(searchTerm);
        item.style.display = isVisible ? "block" : "none";
      });
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? "0" : ""}${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    loadMusic();
  </script>
</body>
</html>
