 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Música Profesional</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #212121;
      color: #fff;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    #search-bar {
      padding: 15px;
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      margin-bottom: 20px;
      outline: none;
      background-color: #333;
      color: #fff;
    }
    #music-list {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .music-item {
      padding: 15px;
      background-color: #1e1e1e;
      color: #fff;
      border-radius: 8px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
    .music-item:hover {
      background-color: #333;
      transform: scale(1.05);
    }
    .active-song {
      background-color: #4caf50; /* Color para la canción actual */
    }
    #audio-player-container {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
    }
    #audio-player {
      width: 100%;
      border-radius: 8px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      justify-content: space-around;
    }
    .control-button {
      background-color: #4caf50;
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    .control-button:hover {
      background-color: #388e3c;
      transform: scale(1.2);
    }
    .control-button:focus {
      outline: none;
    }
  </style>
</head>
<body>

  <h1>Reproductor de Música</h1>
  <input type="text" id="search-bar" placeholder="Buscar canción..." onkeyup="filterMusic()">
  
  <div id="music-list">
    <!-- Las canciones aparecerán aquí -->
  </div>

  <div id="audio-player-container">
    <audio id="audio-player" controls>
      <source id="audio-source" type="audio/mpeg">
      Tu navegador no soporta el reproductor de audio.
    </audio>
    <div class="controls">
      <button class="control-button" id="prev-btn" onclick="prevSong()">
        <i class="fas fa-backward"></i>
      </button>
      <button class="control-button" id="play-pause-btn" onclick="togglePlayPause()">
        <i class="fas fa-play" id="play-icon"></i>
      </button>
      <button class="control-button" id="next-btn" onclick="nextSong()">
        <i class="fas fa-forward"></i>
      </button>
    </div>
  </div>

  <script>
    const songs = [
      {
        title: "Es un secreto",
        url: "https://gitlab.com/anderson1353803/andersonmp3/-/raw/0920a6c28edfacd80d8f3f790c66011e9f47340b/Plan_B_-_Es_Un_Secreto__Official_Video_.mp3"
      },
      {
        title: "Otra Canción",
        url: "https://ejemplo.com/otra_cancion.mp3"
      }
    ];

    let currentSongIndex = 0;

    // Mostrar la lista de canciones
    function displayMusicList(filteredSongs = songs) {
      const musicListContainer = document.getElementById('music-list');
      musicListContainer.innerHTML = '';

      filteredSongs.forEach((song, index) => {
        const musicItem = document.createElement('div');
        musicItem.className = 'music-item';
        musicItem.textContent = song.title;
        musicItem.onclick = () => playSong(index);
        if (index === currentSongIndex) {
          musicItem.classList.add('active-song');
        }
        musicListContainer.appendChild(musicItem);
      });
    }

    // Reproducir una canción específica
    function playSong(index) {
      const song = songs[index];
      const audioPlayer = document.getElementById('audio-player');
      const audioSource = document.getElementById('audio-source');
      audioSource.src = song.url;
      audioPlayer.load();
      audioPlayer.play();
      currentSongIndex = index;

      document.getElementById('play-icon').className = 'fas fa-pause';

      // Resaltar la canción actual
      displayMusicList();
    }

    // Pausar o reanudar la canción
    function togglePlayPause() {
      const audioPlayer = document.getElementById('audio-player');
      const playIcon = document.getElementById('play-icon');

      if (audioPlayer.paused) {
        audioPlayer.play();
        playIcon.className = 'fas fa-pause';
      } else {
        audioPlayer.pause();
        playIcon.className = 'fas fa-play';
      }
    }

    // Cambiar a la canción anterior
    function prevSong() {
      currentSongIndex = (currentSongIndex > 0) ? currentSongIndex - 1 : songs.length - 1;
      playSong(currentSongIndex);
    }

    // Cambiar a la siguiente canción
    function nextSong() {
      currentSongIndex = (currentSongIndex < songs.length - 1) ? currentSongIndex + 1 : 0;
      playSong(currentSongIndex);
    }

    // Filtrar las canciones
    function filterMusic() {
      const searchQuery = document.getElementById('search-bar').value.toLowerCase();
      const filteredSongs = searchQuery
        ? songs.filter(song => song.title.toLowerCase().includes(searchQuery))
        : songs;
      displayMusicList(filteredSongs);
    }

    // Mostrar todas las canciones al cargar la página
    window.onload = () => {
      displayMusicList();
    };
  </script>

</body>
</html>
