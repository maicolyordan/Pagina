  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #333;
      padding: 10px 20px;
      text-align: center;
    }
    header input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    .music-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px;
    }
    .music-item {
      padding: 10px;
      border-bottom: 1px solid #444;
      cursor: pointer;
      transition: background 0.3s;
    }
    .music-item:hover {
      background: #444;
    }
    .music-item.playing {
      background: #00eaff;
      color: #000;
    }
    .player {
      background: #222;
      padding: 20px;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
    }
    #now-playing {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .controls button {
      background: none;
      border: none;
      cursor: pointer;
      width: 50px;
      height: 50px;
    }
    .controls button:focus {
      outline: none;
    }
    .progress-container {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .progress-time {
      font-size: 14px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      margin: 0 10px;
      background: #444;
      border-radius: 2px;
      position: relative;
    }
    .progress {
      height: 100%;
      background: #00eaff;
      border-radius: 2px;
      width: 0;
    }
  </style>

      { title: "REGUETON/Si Tu No Estas - Nicky Jam Ft De la Ghetto  Video Oficial.mp3", artist: "REGUETON", src: "https://github.com/musicaom/Musica-/raw/refs/heads/main/REGUETON/Si%20Tu%20No%20Estas%20-%20Nicky%20Jam%20Ft%20De%20la%20Ghetto%20%20Video%20Oficial.mp3" }

    ];

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const progressBar = document.getElementById("progress-bar");
    const progress = document.getElementById("progress");
    const musicListEl = document.getElementById("music-list");
    const searchInput = document.getElementById("search");
    const nowPlayingEl = document.getElementById("now-playing");

    let currentSongIndex = 0;

    function loadMusic() {
      musicList.forEach((music, index) => {
        const item = document.createElement("div");
        item.className = "music-item";
        item.textContent = music.title;
        item.addEventListener("click", () => playMusic(index));
        musicListEl.appendChild(item);
      });
    }

    function playMusic(index) {
      const items = document.querySelectorAll(".music-item");
      items.forEach(item => item.classList.remove("playing"));

      const currentItem = musicListEl.children[index];
      currentItem.classList.add("playing");

      currentSongIndex = index;
      audio.src = musicList[index].src;
      audio.play();
      playBtn.innerHTML = '<img src="https://i.ibb.co/GchyJGx/1737426658058.png" alt="Pausa" width="50" height="50">';

      nowPlayingEl.textContent = `Reproduciendo: ${musicList[index].title}`;
    }

    function playNextMusic() {
      // Buscar el siguiente índice de canción del mismo artista
      const currentArtist = musicList[currentSongIndex].artist;
      let nextIndex = (currentSongIndex + 1) % musicList.length;

      // Buscar si hay una canción del mismo artista después de la canción actual
      let foundNext = false;
      for (let i = nextIndex; i < musicList.length; i++) {
        if (musicList[i].artist === currentArtist) {
          nextIndex = i;
          foundNext = true;
          break;
        }
      }

      // Si no se encuentra ninguna canción del mismo artista, reinicia desde el principio
      if (!foundNext) {
        for (let i = 0; i < musicList.length; i++) {
          if (musicList[i].artist === currentArtist) {
            nextIndex = i;
            break;
          }
        }
      }

      playMusic(nextIndex);
    }

    function playPreviousMusic() {
      currentSongIndex = (currentSongIndex - 1 + musicList.length) % musicList.length;
      playMusic(currentSongIndex);
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<img src="https://i.ibb.co/GchyJGx/1737426658058.png" alt="Pausa" width="50" height="50">';
      } else {
        audio.pause();
        playBtn.innerHTML = '<img src="https://i.ibb.co/HxGLsRG/1737426685800.png" alt="Play" width="50" height="50">';
      }
    });
 
    document.getElementById("next").addEventListener("click", playNextMusic);
    document.getElementById("prev").addEventListener("click", playPreviousMusic);

    audio.addEventListener("ended", playNextMusic);

    audio.addEventListener("timeupdate", () => {
      const currentTime = Math.floor(audio.currentTime);
      const duration = Math.floor(audio.duration);
      currentTimeEl.textContent = formatTime(currentTime);
      durationEl.textContent = formatTime(duration);
      const progressWidth = (audio.currentTime / audio.duration) * 100;
      progress.style.width = progressWidth + "%";
    });

    progressBar.addEventListener("click", (e) => {
      const width = progressBar.clientWidth;
      const offsetX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (offsetX / width) * duration;
    });

    searchInput.addEventListener("input", (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const items = document.querySelectorAll(".music-item");
      items.forEach((item) => {
        const isVisible = item.textContent.toLowerCase().includes(searchTerm);
        item.style.display = isVisible ? "block" : "none";
      });
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? "0" : ""}${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    loadMusic();
  </script>
</body>
</html>
