<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Música</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #333;
      padding: 10px 20px;
      text-align: center;
    }
    header input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    .music-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px;
    }
    .music-item {
      padding: 10px;
      border-bottom: 1px solid #444;
      cursor: pointer;
      transition: background 0.3s;
    }
    .music-item:hover {
      background: #444;
    }
    .music-item.playing {
      background: #00eaff;
      color: #000;
    }
    .player {
      background: #222;
      padding: 20px;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
    }
    #now-playing {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .controls button {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .controls button:focus {
      outline: none;
    }
    .play-btn {
      background-color: #00eaff;
      color: #000;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 32px;
      border: none;
      cursor: pointer;
    }
    .play-btn:focus {
      outline: none;
    }
    .progress-container {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .progress-time {
      font-size: 14px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      margin: 0 10px;
      background: #444;
      border-radius: 2px;
      position: relative;
    }
    .progress {
      height: 100%;
      background: #00eaff;
      border-radius: 2px;
      width: 0;
    }
  </style>
</head>
<body>
  <header>
    <input type="text" id="search" placeholder="Buscar música...">
  </header>

  <div class="music-list-container" id="music-list">
    <!-- Lista de canciones -->
  </div>

  <div class="player">
    <div id="now-playing">No hay música reproduciéndose</div>
    <div class="progress-container">
      <span class="progress-time" id="current-time">00:00</span>
      <div class="progress-bar" id="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <span class="progress-time" id="duration">00:00</span>
    </div>
    <div class="controls">
      <button id="prev">&#9664;</button>
      <button class="play-btn" id="play">&#9654;</button>
      <button id="next">&#9654;&#9654;</button>
    </div>
    <audio id="audio"></audio>
  </div>

 { title: "REGUETON/Gringo Rasta ft ñengo - Me niegas.mp3", artist: "REGUETON", src: "https://github.com/musicaom/Musica-/raw/refs/heads/main/REGUETON/Gringo%20Rasta%20ft%20%C3%B1engo%20-%20Me%20niegas.mp3" },
 { title: "REGUETON/Wisin Yandel - Algo me gusta de ti.mp3", artist: "REGUETON", src: "https://github.com/musicaom/Musica-/raw/refs/heads/main/REGUETON/Wisin%20Yandel%20-%20Algo%20me%20gusta%20de%20ti.mp3" },
 { title: "REGUETON/Wisin Yandel FT 50 Cent - MUJERES EN EL CLUB.mp3", artist: "REGUETON", src: "https://github.com/musicaom/Musica-/raw/refs/heads/main/REGUETON/Wisin%20Yandel%20FT%2050%20Cent%20-%20MUJERES%20EN%20EL%20CLUB.mp3" }
    ];

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const progressBar = document.getElementById("progress-bar");
    const progress = document.getElementById("progress");
    const musicListEl = document.getElementById("music-list");
    const searchInput = document.getElementById("search");
    const nowPlayingEl = document.getElementById("now-playing");

    let currentSongIndex = 0;

    function loadMusic() {
      musicList.forEach((music, index) => {
        const item = document.createElement("div");
        item.className = "music-item";
        item.textContent = music.title;
        item.addEventListener("click", () => playMusic(index));
        musicListEl.appendChild(item);
      });
    }

    function playMusic(index) {
      const items = document.querySelectorAll(".music-item");
      items.forEach(item => item.classList.remove("playing"));

      const currentItem = musicListEl.children[index];
      currentItem.classList.add("playing");

      currentSongIndex = index;
      audio.src = musicList[index].src;
      audio.play();
      playBtn.textContent = "❚❚";

      // Actualizar el título de la canción
      nowPlayingEl.textContent = `Reproduciendo: ${musicList[index].title}`;
    }

    function playNextMusic() {
      const currentArtist = musicList[currentSongIndex].artist;
      const nextSongIndex = musicList.findIndex((music, index) => music.artist === currentArtist && index > currentSongIndex);
      if (nextSongIndex !== -1) {
        playMusic(nextSongIndex);
      } else {
        playMusic(0); // Reproduce desde el inicio si no hay más canciones del mismo artista
      }
    }

    function playPreviousMusic() {
      currentSongIndex = (currentSongIndex - 1 + musicList.length) % musicList.length;
      playMusic(currentSongIndex);
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "❚❚";
      } else {
        audio.pause();
        playBtn.textContent = "▶";
      }
    });

    document.getElementById("next").addEventListener("click", playNextMusic);
    document.getElementById("prev").addEventListener("click", playPreviousMusic);

    audio.addEventListener("ended", playNextMusic);

    audio.addEventListener("timeupdate", () => {
      const currentTime = Math.floor(audio.currentTime);
      const duration = Math.floor(audio.duration);
      currentTimeEl.textContent = formatTime(currentTime);
      durationEl.textContent = formatTime(duration);
      const progressWidth = (audio.currentTime / audio.duration) * 100;
      progress.style.width = progressWidth + "%";
    });

    progressBar.addEventListener("click", (e) => {
      const width = progressBar.clientWidth;
      const offsetX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (offsetX / width) * duration;
    });

    searchInput.addEventListener("input", (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const items = document.querySelectorAll(".music-item");
      items.forEach((item) => {
        const isVisible = item.textContent.toLowerCase().includes(searchTerm);
        item.style.display = isVisible ? "block" : "none";
      });
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? "0" : ""}${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    loadMusic();
  </script>
