 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APUESTA VIP</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
        }
        button {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
    <script>
        function verificarContraseña() {
            const contraseña = document.getElementById("contraseña").value;
            const mensajeError = document.getElementById("error");

            if (contraseña === "1234") {
                window.location.href = "https://apuestonvip.com/auth/3m9kOI";
            } else {
                mensajeError.textContent = "Contraseña incorrecta. Inténtalo de nuevo.";
            }
        }
    </script>
</head>
<body>
    <h1>APUESTA VIP</h1>
    <input type="password" id="contraseña" placeholder="Contraseña">
    <button onclick="verificarContraseña()">Ingresar</button>
    <div id="error" class="error"></div>
</body>
</html>
