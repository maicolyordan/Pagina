 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Virtual</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #10a37f;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
    }

    #chat {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .usuario {
      background-color: #dcf8c6;
      align-self: flex-end;
    }

    .asistente {
      background-color: #e8e8e8;
      align-self: flex-start;
    }

    #entrada {
      display: flex;
      padding: 10px;
      background-color: white;
      border-top: 1px solid #ccc;
    }

    #mensaje {
      flex: 1;
      font-size: 15px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      padding: 10px 15px;
      margin-left: 8px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background-color: #10a37f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d8668;
    }
  </style>
</head>
<body>

  <header>Asistente Virtual</header>

  <div id="chat"></div>

  <div id="entrada">
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje...">
    <button onclick="responder()">Enviar</button>
  </div>

  <script src="respuestas.js"></script>
  <script>
    function agregarMensaje(texto, clase) {
  const burbuja = document.createElement("div");
  burbuja.className = `mensaje ${clase}`;
  burbuja.innerText = texto;
  document.getElementById("chat").appendChild(burbuja);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}

function encontrarRespuesta(mensaje) {
  const palabrasMensaje = mensaje.toLowerCase().split(/\W+/);
  let mejorCoincidencia = "";
  let maxCoincidencias = 0;

  for (let clave in baseDeRespuestas) {
    const palabrasClave = clave.toLowerCase().split(/\W+/);
    const coincidencias = palabrasClave.filter(palabra => palabrasMensaje.includes(palabra)).length;

    if (coincidencias > maxCoincidencias) {
      maxCoincidencias = coincidencias;
      mejorCoincidencia = clave;
    }
  }

  return maxCoincidencias > 0 ? baseDeRespuestas[mejorCoincidencia] : "No estoy seguro de qué responder a eso.";
}

function responder() {
  const input = document.getElementById("mensaje");
  const mensajeUsuario = input.value.trim();
  if (!mensajeUsuario) return;

  agregarMensaje(mensajeUsuario, "usuario");
  input.value = "";

  const respuesta = encontrarRespuesta(mensajeUsuario);

  setTimeout(() => {
    agregarMensaje(respuesta, "asistente");
  }, 500);
}
  </script>

</body>
</html>
